# Shell syntax and the hermetic tests under tests/, on every pull request and on main.
# macOS only: the plugin sets up a Mac and its tests assert macOS behaviour.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: shell syntax
        run: |
          rc=0
          for f in bin/*.sh scripts/*.sh hooks/*.sh tests/*.sh skills/*/scripts/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || { echo "syntax: $f"; rc=1; }
          done
          exit $rc
      - name: tests
        run: |
          rc=0
          for t in tests/*.sh; do
            if bash "$t"; then echo "pass  $t"; else echo "FAIL  $t"; rc=1; fi
          done
          exit $rc
